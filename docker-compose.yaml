services:
  # Emulates AWS SQS and DynamoDB locally on port 4566
  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,dynamodb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Provisions the DynamoDB table and SQS queue once LocalStack is healthy
  aws-init:
    image: amazon/aws-cli:latest
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url=http://localstack:4566 dynamodb create-table --table-name TaskStateTable --attribute-definitions AttributeName=task_id,AttributeType=S --key-schema AttributeName=task_id,KeyType=HASH --billing-mode PAY_PER_REQUEST &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name task-processing-queue
    depends_on:
      localstack:
        condition: service_healthy

  # Runs the FastAPI ingestion server on port 8000
  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - DYNAMODB_TABLE_NAME=TaskStateTable
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/task-processing-queue
    depends_on:
      aws-init:
        condition: service_completed_successfully

  # Runs the continuous background worker daemon in a separate scalable container
  worker:
    build: .
    command: python -m src.workers.processor
    restart: on-failure
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - DYNAMODB_TABLE_NAME=TaskStateTable
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/task-processing-queue
    depends_on:
      aws-init:
        condition: service_completed_successfully
    deploy:
      replicas: 2